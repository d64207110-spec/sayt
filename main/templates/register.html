{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="center card">
  <h1>Регистрация</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Создать аккаунт</button>
  </form>
  <p class="meta">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
